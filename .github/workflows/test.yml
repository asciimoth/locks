name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22.x', stable]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test ./...
        env:
          # Go 1.22 needs an explicit Mach-O UUID for macOS 26.
          GOFLAGS: ${{ runner.os == 'macOS' && matrix.go == '1.22.x' && '-ldflags=-B=gobuildid' || '' }}
      - run: go vet ./...
  coverage-and-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test -race ./...
      - run: scripts/coverage.sh
      - name: Cross-compile OpenBSD tests
        run: GOOS=openbsd GOARCH=amd64 CGO_ENABLED=0 go test -c -o "$RUNNER_TEMP/locks-openbsd.test" .
